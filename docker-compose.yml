services:
  postgres:
    image: postgres:15-alpine
    container_name: teampulse-postgres
    environment:
      POSTGRES_USER: teampulse
      POSTGRES_PASSWORD: teampulse123
      POSTGRES_DB: teampulse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: teampulse-dynamodb
    ports:
      - "8000:8000"

  api-gateway:
    build: ./services/api-gateway
    container_name: teampulse-api-gateway
    environment:
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - habit-service
      - challenge-service
      - event-tracking-service
      - insight-service
      - recommendation-service
      - notification-service

  identity-service:
    build: ./services/identity-service
    container_name: teampulse-identity-service
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://teampulse:teampulse123@postgres:5432/teampulse
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  habit-service:
    build: ./services/habit-service
    container_name: teampulse-habit-service
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://teampulse:teampulse123@postgres:5432/teampulse
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  challenge-service:
    build: ./services/challenge-service
    container_name: teampulse-challenge-service
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://teampulse:teampulse123@postgres:5432/teampulse
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy

  event-tracking-service:
    build: ./services/event-tracking-service
    container_name: teampulse-event-tracking-service
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://teampulse:teampulse123@postgres:5432/teampulse
      LAMBDA_WORKER_URL: http://lambda-workers:3008
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy

  insight-service:
    build: ./services/insight-service
    container_name: teampulse-insight-service
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://teampulse:teampulse123@postgres:5432/teampulse
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy

  recommendation-service:
    build: ./services/recommendation-service
    container_name: teampulse-recommendation-service
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://teampulse:teampulse123@postgres:5432/teampulse
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    container_name: teampulse-notification-service
    environment:
      PORT: 3007
      DATABASE_URL: postgresql://teampulse:teampulse123@postgres:5432/teampulse
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy

  lambda-workers:
    build: ./services/lambda-workers
    container_name: teampulse-lambda-workers
    environment:
      PORT: 3008
      DATABASE_URL: postgresql://teampulse:teampulse123@postgres:5432/teampulse
    ports:
      - "3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
